# Push to main ships. After check.yml passes, scripts/ship.mjs auto looks at what changed since
# the last "Changelog: …" commit: app/, components/, lib/ or assets/ means an over-the-air update;
# package.json, package-lock.json, app.config.ts, eas.json, a migration or "[native]" in the
# subject means a TestFlight build (migrations are applied first); web/ or the feed function
# means the web version: the function is deployed to Supabase and the page is built into web/dist,
# which the deploy-pages job below puts on GitHub Pages (Settings → Pages, source "GitHub
# Actions"). A push can be any combination. It then moves the Unreleased changelog lines into a
# dated section, commits that with [skip ci] and pushes, and for a native build writes the section
# to TestFlight's "What to Test" once Apple has processed the build. A push with nothing under
# Unreleased and no app change ships nothing.
#
# Runs queue (concurrency group "ship") so two pushes never publish over each other. Secrets:
# EXPO_TOKEN, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64, APPLE_TEAM_ID, ASC_APP_ID,
# SUPABASE_URL, SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions). The web
# version's own secrets (FEED_TOKEN, FEED_PIN) never pass through here: npm run setup feed.
name: Ship

on:
  push:
    branches: [main]

concurrency:
  group: ship
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    uses: ./.github/workflows/check.yml
    secrets: inherit

  ship:
    needs: check
    runs-on: ubuntu-latest
    environment: main
    timeout-minutes: 120
    outputs:
      web: ${{ steps.ship.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Git identity for the changelog commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Ship
        id: ship
        run: node scripts/ship.mjs auto
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: The built page, for the deploy-pages job
        if: ${{ !cancelled() && steps.ship.outputs.web == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  # The page goes live only after the ship job has deployed the feed function it talks to.
  deploy-pages:
    needs: ship
    if: ${{ !cancelled() && needs.ship.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy web/dist to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
