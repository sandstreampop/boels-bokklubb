# TestFlight builds expire after 90 days. This rebuilds and resubmits on the 1st of every month,
# and can be run by hand from the Actions tab. It is the same ship as a native build from
# ship.yml: the version bumps, the changelog gets a section ("Monthly refresh, nothing new" when
# there is nothing under Unreleased) and TestFlight's "What to Test" is written. Same secrets as
# ship.yml, set by hand in Settings → Secrets and variables → Actions.
name: TestFlight refresh

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

concurrency:
  group: ship
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Git identity for the changelog commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build, submit, write What to Test
        run: node scripts/ship.mjs build --refresh
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
